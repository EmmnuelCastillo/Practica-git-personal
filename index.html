<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sabores</title>
</head>
<body>

    <h1>Sabores de Helado</h1>

    <button onclick="mostrar()">Mostrar</button>
    <button onclick="agregar()">Agregar</button>
    <button onclick="contar()">Contar</button>

    <p id="texto"></p>

    <script>

        let sabores = ["Chocolate", "Vainilla", "Fresa"];

        function mostrar() {
            document.getElementById("texto").innerHTML = sabores;
        }

        function agregar() {
            sabores.push("Mango");
            document.getElementById("texto").innerHTML = "Se agregó Mango";
        }

        function contar() {
            document.getElementById("texto").innerHTML =
            "Total: " + sabores.length;
        }

    </script>

</body>
</html>
